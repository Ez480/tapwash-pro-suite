name: Fix employee React object rendering direct

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: employee React object rendering direct [applied]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize employee display values
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/_authenticated/employee-tasks.tsx')
          s = p.read_text()

          marker = '  const mine = roles.includes("employee") ? (tasks as any[]).filter(t => t.employee_id === user?.id) : [];'
          helper = '''  const textValue = (value: any) => {\n    if (value == null || value === "") return "—";\n    if (typeof value === "object") return String(value.title_ar || value.title_en || value.name || value.label || "—");\n    return String(value);\n  };\n\n'''
          replacement = '''  const mine = roles.includes("employee") ? (tasks as any[]).filter(t => t.employee_id === user?.id).map((t: any) => ({\n    ...t,\n    title: textValue(t.title),\n    status: textValue(t.status),\n    wash_type: textValue(t.wash_type),\n    package_name: textValue(t.package_name),\n    offer_name: textValue(t.offer_name),\n    location_text: textValue(t.location_text),\n  })) : [];'''

          if 'const textValue = (value: any)' not in s:
              if marker not in s:
                  raise SystemExit('employee mine marker not found')
              s = s.replace(marker, helper + replacement, 1)
          else:
              s = s.replace(marker, replacement, 1)

          # Normalize NFC subscription package values before putting them into card state.
          s = s.replace('package: subscription.package_name || subscription.package, package_name: subscription.package_name || subscription.package,', 'package: textValue(subscription.package_name || subscription.package), package_name: textValue(subscription.package_name || subscription.package),', 2)

          p.write_text(s)
          PY
          git diff --check
          git diff -- src/routes/_authenticated/employee-tasks.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/_authenticated/employee-tasks.tsx
          git commit -m 'fix: employee React object rendering direct [applied]'
          git push
          git rm .github/workflows/fix-employee-react31-direct.yml
          git commit -m 'chore: remove one-time employee React31 workflow'
          git push
