name: Fix employee NFC check-in

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: employee NFC customer details and wash deduction [applied]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch employee NFC safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/routes/_authenticated/employee-tasks.tsx')
          s = p.read_text()

          if 'const extractCardValue = ' not in s:
              pattern = r'  const scanNfc = async \(\) => \{.*?\n\n  const renderOrder'
              replacement = '''  const extractCardValue = (event: any) => {\n    for (const record of event?.message?.records ?? []) {\n      try {\n        const text = new TextDecoder(record.encoding || "utf-8").decode(record.data).trim();\n        try {\n          const parsed = JSON.parse(text);\n          const id = parsed.uid || parsed.card_serial || parsed.serial_number || parsed.url;\n          if (id) return String(id).trim();\n        } catch {}\n        try {\n          const url = new URL(text);\n          const parts = url.pathname.split("/").filter(Boolean);\n          const i = parts.findIndex((x: string) => x.toLowerCase() === "nfc");\n          if (i >= 0 && parts[i + 1]) return decodeURIComponent(parts[i + 1]).trim();\n        } catch {}\n        if (text) return text.replace(/^\\u0000+/, "").trim();\n      } catch {}\n    }\n    return "";\n  };\n\n  const scanNfc = async () => {\n    if (!window.NDEFReader) return toast.error(pick("Web NFC is not supported here. Use Chrome on Android with NFC enabled.", "المتصفح لا يدعم NFC. استخدم Chrome على Android مع تشغيل NFC."));\n    try {\n      setScanning(true);\n      const reader = new window.NDEFReader();\n      await reader.scan();\n      toast.info(pick("Bring the customer NFC card close to the phone.", "قرّب كارت العميل من الموبايل."));\n      reader.onreadingerror = () => { setScanning(false); toast.error(pick("Could not read the NFC card.", "تعذر قراءة كارت العميل.")); };\n      reader.onreading = async (event: any) => {\n        const value = extractCardValue(event);\n        setScanning(false);\n        if (!value) return toast.error(pick("The card has no readable NFC value.", "الكارت لا يحتوي على قيمة NFC قابلة للقراءة."));\n        const { data, error } = await (supabase as any).rpc("public_nfc_lookup", { p_uid: value });\n        if (error) return toast.error(error.message);\n        if (!data) return toast.error(pick("NFC card not found.", "كارت NFC غير موجود."));\n        const customer = data.customer || {};\n        const car = data.car || {};\n        const subscription = data.subscription || {};\n        setCard({ ...data, _cardValue: value, name: customer.full_name, full_name: customer.full_name, phone: customer.phone, package: subscription.package_name || subscription.package, package_name: subscription.package_name || subscription.package, remaining_washes: subscription.remaining_washes, customer, car, subscription });\n        toast.success(pick("Customer card scanned", "تمت قراءة كارت العميل"));\n      };\n    } catch (e) {\n      setScanning(false);\n      toast.error(e instanceof Error ? e.message : pick("NFC scan failed", "فشل مسح NFC"));\n    }\n  };\n\n  const deductScannedWash = async () => {\n    if (!card?._cardValue || loading === "nfc") return;\n    const remaining = Number(card.subscription?.remaining_washes ?? card.remaining_washes ?? 0);\n    if (remaining <= 0) return toast.error(pick("No remaining subscription washes.", "لا توجد غسلات متبقية في الاشتراك."));\n    if (!window.confirm(pick("Confirm recording this wash? One wash will be deducted.", "هل تريد تأكيد تسجيل الغسلة؟ سيتم خصم غسلة واحدة."))) return;\n    setLoading("nfc");\n    const { error } = await (supabase as any).rpc("checkin_nfc_card", { p_card_value: card._cardValue, p_booking_id: null });\n    if (error) { setLoading(null); return toast.error(error.message); }\n    const { data: refreshed, error: refreshError } = await (supabase as any).rpc("public_nfc_lookup", { p_uid: card._cardValue });\n    if (refreshError) { setLoading(null); return toast.error(refreshError.message); }\n    setCard(refreshed ? { ...refreshed, _cardValue: card._cardValue, name: refreshed.customer?.full_name, full_name: refreshed.customer?.full_name, phone: refreshed.customer?.phone, package: refreshed.subscription?.package_name || refreshed.subscription?.package, package_name: refreshed.subscription?.package_name || refreshed.subscription?.package, remaining_washes: refreshed.subscription?.remaining_washes } : null);\n    setLoading(null);\n    toast.success(pick("Wash recorded successfully.", "تم تسجيل الغسلة بنجاح."));\n  };\n\n  const nfcPanel = card ? <div className="mt-5 rounded-2xl border p-4 sm:p-5"><div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-4"><div><p className="text-xs text-muted-foreground">{pick("Customer", "العميل")}</p><b>{card.customer?.full_name || card.name || card.full_name || "—"}</b><p className="text-sm text-muted-foreground">{card.customer?.phone || card.phone || "—"}</p></div><div><p className="text-xs text-muted-foreground">{pick("Vehicle", "العربية")}</p><b>{[card.car?.brand, card.car?.model, card.car?.color, card.car?.plate_number].filter(Boolean).join(" · ") || "—"}</b></div><div><p className="text-xs text-muted-foreground">{pick("Package", "الباقة")}</p><b>{card.subscription?.package_name || card.subscription?.package || card.package_name || card.package || "—"}</b></div><div><p className="text-xs text-muted-foreground">{pick("Remaining washes", "الغسلات المتبقية")}</p><b className="text-2xl text-primary">{card.subscription?.remaining_washes ?? card.remaining_washes ?? "—"}</b></div></div><div className="mt-4 flex flex-wrap items-center justify-end gap-3"><Button onClick={() => void deductScannedWash()} disabled={loading === "nfc" || Number(card.subscription?.remaining_washes ?? card.remaining_washes ?? 0) <= 0}><Droplets className="me-1 size-4" />{loading === "nfc" ? pick("Recording...", "جاري التسجيل...") : pick("Record wash — deduct 1", "تسجيل الغسلة — خصم 1")}</Button></div></div> : null;\n\n  const renderOrder'''
              s2, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
              if count != 1: raise SystemExit('employee NFC function block not found')
              s = s2

          if 'Droplets' not in s.split('from "lucide-react"', 1)[0]:
              s = s.replace('Camera, CheckCircle2, Clock3, KeyRound, LogOut, MapPin, Moon, Navigation, ScanLine, Sun, UserCog', 'Camera, CheckCircle2, Clock3, Droplets, KeyRound, LogOut, MapPin, Moon, Navigation, ScanLine, Sun, UserCog', 1)

          marker = 'return <div className="min-h-screen w-full overflow-x-hidden bg-background text-foreground">'
          if '{nfcPanel}' not in s:
              if marker not in s: raise SystemExit('employee dashboard render marker not found')
              s = s.replace(marker, marker + '{nfcPanel}', 1)

          p.write_text(s)
          PY
          git diff --check
          git diff -- src/routes/_authenticated/employee-tasks.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/_authenticated/employee-tasks.tsx
          git commit -m 'fix: employee NFC customer details and wash deduction [applied]'
          git push
          git rm .github/workflows/fix-employee-nfc.yml
          git commit -m 'chore: remove one-time employee NFC patch workflow'
          git push