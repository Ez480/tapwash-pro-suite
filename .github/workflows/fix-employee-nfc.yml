name: Fix employee NFC check-in

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: employee NFC customer details and wash deduction [applied]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch employee NFC
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/routes/_authenticated/employee-tasks.tsx')
          s=p.read_text()
          old='const scanNfc = async () => { if (!window.NDEFReader) return toast.error(pick("Web NFC is not supported here. Use Chrome on Android with NFC enabled.", "المتصفح لا يدعم NFC. استخدم Chrome on Android مع تشغيل NFC.")); try { setScanning(true); const reader = new window.NDEFReader(); await reader.scan(); toast.info(pick("Bring the customer NFC card close to the phone.", "قرّب كارت العميل من الموبايل.")); reader.onreadingerror = () => { setScanning(false); toast.error(pick("Could not read the NFC card.", "تعذر قراءة كارت العميل.")); }; reader.onreading = (event: any) => { let raw = ""; for (const record of event.message.records) { try { raw += new TextDecoder(record.encoding || "utf-8").decode(record.data); } catch {} } let data: any; try { data = JSON.parse(raw); } catch { data = { card_serial: raw }; } setCard(data); setScanning(false); toast.success(pick("Customer card scanned", "تمت قراءة كارت العميل")); }; } catch (e) { setScanning(false); toast.error(e instanceof Error ? e.message : pick("NFC scan failed", "فشل مسح NFC")); } };'
          new='const extractCardValue = (event: any) => { for (const record of event?.message?.records ?? []) { try { const text = new TextDecoder(record.encoding || "utf-8").decode(record.data).trim(); try { const parsed = JSON.parse(text); const id = parsed.uid || parsed.card_serial || parsed.serial_number || parsed.url; if (id) return String(id).trim(); } catch {} try { const url = new URL(text); const parts = url.pathname.split("/").filter(Boolean); const i = parts.findIndex((x: string) => x.toLowerCase() === "nfc"); if (i >= 0 && parts[i + 1]) return decodeURIComponent(parts[i + 1]).trim(); } catch {} if (text) return text.replace(/^\u0000+/, "").trim(); } catch {} } return ""; };
  const scanNfc = async () => { if (!window.NDEFReader) return toast.error(pick("Web NFC is not supported here. Use Chrome on Android with NFC enabled.", "المتصفح لا يدعم NFC. استخدم Chrome على Android مع تشغيل NFC.")); try { setScanning(true); const reader = new window.NDEFReader(); await reader.scan(); toast.info(pick("Bring the customer NFC card close to the phone.", "قرّب كارت العميل من الموبايل.")); reader.onreadingerror = () => { setScanning(false); toast.error(pick("Could not read the NFC card.", "تعذر قراءة كارت العميل.")); }; reader.onreading = async (event: any) => { const value = extractCardValue(event); setScanning(false); if (!value) return toast.error(pick("The card has no readable NFC value.", "الكارت لا يحتوي على قيمة NFC قابلة للقراءة.")); const { data, error } = await (supabase as any).rpc("public_nfc_lookup", { p_uid: value }); if (error) return toast.error(error.message); if (!data) return toast.error(pick("NFC card not found.", "كارت NFC غير موجود.")); setCard({ ...data, _cardValue: value }); toast.success(pick("Customer card scanned", "تمت قراءة كارت العميل")); }; } catch (e) { setScanning(false); toast.error(e instanceof Error ? e.message : pick("NFC scan failed", "فشل مسح NFC")); } };
  const deductScannedWash = async () => { if (!card?._cardValue || loading === "nfc") return; if ((card.subscription?.remaining_washes ?? 0) <= 0) return toast.error(pick("No remaining subscription washes.", "لا توجد غسلات متبقية في الاشتراك.")); if (!window.confirm(pick("Confirm recording this wash? One wash will be deducted.", "هل تريد تأكيد تسجيل الغسلة؟ سيتم خصم غسلة واحدة."))) return; setLoading("nfc"); const { error } = await (supabase as any).rpc("checkin_nfc_card", { p_card_value: card._cardValue, p_booking_id: null }); if (error) { setLoading(null); return toast.error(error.message); } const { data: refreshed } = await (supabase as any).rpc("public_nfc_lookup", { p_uid: card._cardValue }); setCard(refreshed ? { ...refreshed, _cardValue: card._cardValue } : null); setLoading(null); toast.success(pick("Wash recorded successfully.", "تم تسجيل الغسلة بنجاح.")); };'
          if old not in s: raise SystemExit('expected NFC function not found')
          s=s.replace(old,new,1)
          old_ui='<div className="mt-5 grid gap-3 rounded-2xl border p-4 sm:grid-cols-2 lg:grid-cols-4 sm:p-5"><div><p className="text-xs text-muted-foreground">{pick("Customer", "العميل")}</p><b>{card.name || card.full_name || "—"}</b></div><div><p className="text-xs text-muted-foreground">{pick("Phone", "الهاتف")}</p><b>{card.phone || "—"}</b></div><div><p className="text-xs text-muted-foreground">{pick("Package", "الباقة")}</p><b>{card.package || card.package_name || "—"}</b></div><div><p className="text-xs text-muted-foreground">{pick("Remaining washes", "الغسلات المتبقية")}</p><b className="text-2xl text-primary">{card.remaining_washes ?? card.remaining ?? "—"}</b></div></div>'
          new_ui='<div className="mt-5 space-y-4 rounded-2xl border p-4 sm:p-5"><div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-4"><div><p className="text-xs text-muted-foreground">{pick("Customer", "العميل")}</p><b>{card.customer?.full_name || "—"}</b></div><div><p className="text-xs text-muted-foreground">{pick("Phone", "الهاتف")}</p><b>{card.customer?.phone || "—"}</b></div><div><p className="text-xs text-muted-foreground">{pick("Vehicle", "العربية")}</p><b>{[card.car?.brand,card.car?.model,card.car?.color,card.car?.plate_number].filter(Boolean).join(" · ") || "—"}</b></div><div><p className="text-xs text-muted-foreground">{pick("Package", "الباقة")}</p><b>{card.subscription?.package_name || card.subscription?.package || "—"}</b></div></div><div className="flex flex-wrap items-center justify-between gap-3"><b>{pick("Remaining washes", "الغسلات المتبقية")}: <span className="text-2xl text-primary">{card.subscription?.remaining_washes ?? "—"}</span></b><Button onClick={() => void deductScannedWash()} disabled={loading === "nfc" || (card.subscription?.remaining_washes ?? 0) <= 0}><Droplets className="me-1 size-4" />{loading === "nfc" ? pick("Recording...", "جاري التسجيل...") : pick("Record wash — deduct 1", "تسجيل الغسلة — خصم 1")}</Button></div></div>'
          if old_ui not in s: raise SystemExit('expected NFC UI not found')
          s=s.replace(old_ui,new_ui,1)
          s=s.replace('Camera, CheckCircle2, Clock3, KeyRound, LogOut, MapPin, Moon, Navigation, ScanLine, Sun, UserCog','Camera, CheckCircle2, Clock3, Droplets, KeyRound, LogOut, MapPin, Moon, Navigation, ScanLine, Sun, UserCog',1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- src/routes/_authenticated/employee-tasks.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/_authenticated/employee-tasks.tsx
          git commit -m 'fix: employee NFC customer details and wash deduction [applied]'
          git push
          git rm .github/workflows/fix-employee-nfc.yml
          git commit -m 'chore: remove one-time employee NFC patch workflow'
          git push
