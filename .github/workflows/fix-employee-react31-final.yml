name: Fix employee React object rendering final

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: employee React31 object values final [applied]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize all employee display objects
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/_authenticated/employee-tasks.tsx')
          s = p.read_text()

          marker = '  const mine = roles.includes("employee") ? (tasks as any[]).filter(t => t.employee_id === user?.id) : [];'
          helper = '''  const textValue = (value: any) => {\n    if (value == null || value === "") return "—";\n    if (typeof value === "object") return String(value.title_ar || value.title_en || value.name || value.label || "—");\n    return String(value);\n  };\n\n'''
          normalized_mine = '''  const mine = roles.includes("employee") ? (tasks as any[]).filter(t => t.employee_id === user?.id).map((t: any) => ({\n    ...t,\n    title: textValue(t.title),\n    status: textValue(t.status),\n    wash_type: textValue(t.wash_type),\n    package_name: textValue(t.package_name),\n    offer_name: textValue(t.offer_name),\n    location_text: textValue(t.location_text),\n  })) : [];'''

          if 'const textValue = (value: any)' not in s:
              if marker not in s: raise SystemExit('mine marker not found')
              s = s.replace(marker, helper + normalized_mine, 1)
          else:
              s = s.replace(marker, normalized_mine, 1)

          # Normalize package objects at the exact point where NFC data enters state.
          s = s.replace(
              'const subscription = data.subscription || {};\n        setCard({ ...data, _cardValue: value, name: customer.full_name, full_name: customer.full_name, phone: customer.phone, package: subscription.package_name || subscription.package, package_name: subscription.package_name || subscription.package, remaining_washes: subscription.remaining_washes, customer, car, subscription });',
              'const rawSubscription = data.subscription || {};\n        const subscription = { ...rawSubscription, package_name: textValue(rawSubscription.package_name), package: textValue(rawSubscription.package) };\n        setCard({ ...data, _cardValue: value, name: customer.full_name, full_name: customer.full_name, phone: customer.phone, package: textValue(subscription.package_name || subscription.package), package_name: textValue(subscription.package_name || subscription.package), remaining_washes: subscription.remaining_washes, customer, car, subscription });',
              1
          )
          s = s.replace(
              'setCard(refreshed ? { ...refreshed, _cardValue: card._cardValue, name: refreshed.customer?.full_name, full_name: refreshed.customer?.full_name, phone: refreshed.customer?.phone, package: refreshed.subscription?.package_name || refreshed.subscription?.package, package_name: refreshed.subscription?.package_name || refreshed.subscription?.package, remaining_washes: refreshed.subscription?.remaining_washes, customer: refreshed.customer, car: refreshed.car, subscription: refreshed.subscription } : null);',
              'setCard(refreshed ? (() => { const rawSubscription = refreshed.subscription || {}; const subscription = { ...rawSubscription, package_name: textValue(rawSubscription.package_name), package: textValue(rawSubscription.package) }; return { ...refreshed, _cardValue: card._cardValue, name: refreshed.customer?.full_name, full_name: refreshed.customer?.full_name, phone: refreshed.customer?.phone, package: textValue(subscription.package_name || subscription.package), package_name: textValue(subscription.package_name || subscription.package), remaining_washes: subscription.remaining_washes, customer: refreshed.customer, car: refreshed.car, subscription }; })() : null);',
              1
          )

          # Defensive rendering replacements for values that can be objects.
          for field in ['title','status','wash_type','package_name','offer_name','location_text','package']:
              s = s.replace('{t.' + field + '}', '{textValue(t.' + field + ')}')
          s = s.replace('{card.subscription?.package_name || card.subscription?.package || card.package_name || card.package || "—"}', '{textValue(card.subscription?.package_name || card.subscription?.package || card.package_name || card.package)}')
          s = s.replace('{card.subscription?.package_name || card.subscription?.package || "—"}', '{textValue(card.subscription?.package_name || card.subscription?.package)}')
          s = s.replace('{card.package_name}', '{textValue(card.package_name)}')
          s = s.replace('{card.package}', '{textValue(card.package)}')

          p.write_text(s)
          PY
          git diff --check
          git diff -- src/routes/_authenticated/employee-tasks.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/_authenticated/employee-tasks.tsx
          git commit -m 'fix: employee React31 object values final [applied]'
          git push
          git rm .github/workflows/fix-employee-react31-final.yml
          git commit -m 'chore: remove final one-time employee React31 workflow'
          git push
