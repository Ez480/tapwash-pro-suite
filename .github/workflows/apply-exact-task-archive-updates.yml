name: Apply exact task archive updates

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'chore: apply exact task archive updates [done]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply requested changes exactly
        run: |
          python3 - <<'PY2'
          from pathlib import Path

          def edit(path, fn):
              p = Path(path)
              old = p.read_text()
              new = fn(old)
              if new != old:
                  p.write_text(new)
                  print(f'updated: {path}')
              else:
                  print(f'unchanged: {path}')

          def tasks(s):
              s = s.replace(
                  'import { CheckCircle2, ClipboardList, ExternalLink, MapPin, Plus, Trash2, CarFront } from "lucide-react";',
                  'import { CheckCircle2, ClipboardList, ExternalLink, MapPin, Plus, Trash2, CarFront, XCircle } from "lucide-react";', 1)
              s = s.replace(
                  'const {data:tasks=[],refetch}=useAdminTable("employee_tasks","*","created_at");',
                  'const {data:allTasks=[],refetch}=useAdminTable("employee_tasks","*","created_at");\n const tasks=allTasks.filter((t:any)=>!["completed","cancelled"].includes(String(t.status||"pending").toLowerCase()));', 1)
              s = s.replace(
                  '{task.status!=="completed"&&<Button size="sm" onClick={()=>void updateStatus(task.id,"completed")}><CheckCircle2 className="me-1 size-4"/>{pick("Complete","تم التنفيذ")}</Button>}',
                  '{!["completed","cancelled"].includes(String(task.status||"pending").toLowerCase())&&<><Button size="sm" onClick={()=>void updateStatus(task.id,"completed")}><CheckCircle2 className="me-1 size-4"/>{pick("Complete","تم التنفيذ")}</Button><Button size="sm" variant="outline" onClick={()=>void updateStatus(task.id,"cancelled")}><XCircle className="me-1 size-4"/>{pick("Cancel","إلغاء")}</Button></>}', 1)
              s = s.replace(
                  '<Button size="sm" variant="ghost" onClick={()=>void removeTask(task.id)}><Trash2 className="me-1 size-4"/>{pick("Delete","حذف")}</Button>',
                  '{!["completed","cancelled"].includes(String(task.status||"pending").toLowerCase())&&<Button size="sm" variant="ghost" onClick={()=>void removeTask(task.id)}><Trash2 className="me-1 size-4"/>{pick("Delete","حذف")}</Button>}', 1)
              return s

          def archive(s):
              marker = 'const profiles=profilesRes.data??[]; const profile=(id:any)=>profiles.find((p:any)=>String(p.id)===String(id));'
              helpers = '''const profiles=profilesRes.data??[]; const profile=(id:any)=>profiles.find((p:any)=>String(p.id)===String(id));
  const bookingById=(id:any)=>(bookingsRes.data??[]).find((b:any)=>String(b.id)===String(id));
  const orderSource=(x:any)=>x.booking_request_id?"طلب عميل":x.offer_id?"عرض":x.subscription_id?"اشتراك":x.scheduled_at?"مجدول":"مهمة";
  const employeeName=(x:any)=>profile(x.employee_id)?.full_name||x.employee_name||x.assigned_employee_name||x.employee_full_name||"—";
  const requestCreatedAt=(x:any)=>bookingById(x.booking_request_id)?.created_at||x.created_at;'''
              if marker in s and 'const orderSource=' not in s:
                  s = s.replace(marker, helpers, 1)
              old_card = '''<div className="mt-4 grid gap-3 sm:grid-cols-2 lg:grid-cols-4"><div className="rounded-xl border p-3"><small className="text-muted-foreground">اسم العميل</small><p className="font-semibold">{x.customer_name||"—"}</p></div><div className="rounded-xl border p-3"><small className="text-muted-foreground">رقم التليفون</small><p className="font-semibold">{x.customer_phone||"—"}</p></div><div className="rounded-xl border p-3"><small className="text-muted-foreground">نوع الباقة</small><p className="font-semibold">{x.package_name||x.offer_name||x.wash_type||"—"}</p></div><div className="rounded-xl border p-3"><small className="text-muted-foreground">المتبقي</small><p className="font-semibold">{x.remaining_washes!=null?`${x.remaining_washes} غسلة`:"—"}</p></div><div className="rounded-xl border p-3 sm:col-span-2"><small className="text-muted-foreground">الموظف المكلف</small><p className="font-semibold">{x.employee_name||x.assigned_employee_name||x.employee_full_name||"—"}</p><p className="text-xs text-muted-foreground mt-1">Employee ID: {x.employee_id||x.assigned_employee_id||"—"}</p></div><div className="rounded-xl border p-3 sm:col-span-2"><small className="text-muted-foreground">ملاحظات</small><p>{x.notes||"—"}</p></div></div>'''
              new_card = '''<div className="mt-4 grid gap-3 sm:grid-cols-2 lg:grid-cols-4"><div className="rounded-xl border p-3"><small className="text-muted-foreground">نوع الأوردر</small><p className="font-semibold">{orderSource(x)}</p></div><div className="rounded-xl border p-3"><small className="text-muted-foreground">اسم العميل</small><p className="font-semibold">{x.customer_name||"—"}</p></div><div className="rounded-xl border p-3"><small className="text-muted-foreground">رقم التليفون</small><p className="font-semibold">{x.customer_phone||"—"}</p></div><div className="rounded-xl border p-3"><small className="text-muted-foreground">الموظف المكلف</small><p className="font-semibold">{employeeName(x)}</p></div><div className="rounded-xl border p-3"><small className="text-muted-foreground">تاريخ ووقت طلب العميل</small><p className="font-semibold">{requestCreatedAt(x)?new Date(requestCreatedAt(x)).toLocaleString():"—"}</p></div><div className="rounded-xl border p-3"><small className="text-muted-foreground">تاريخ التنفيذ</small><p className="font-semibold">{x.scheduled_at?new Date(x.scheduled_at).toLocaleString():"—"}</p></div><div className="rounded-xl border p-3 sm:col-span-2"><small className="text-muted-foreground">ملاحظات</small><p>{x.notes||"—"}</p></div></div>'''
              s = s.replace(old_card, new_card, 1)
              s = s.replace(
                  'const created=x.updated_at||x.created_at||x.washed_at;',
                  'const created=x._type==="order"?(x.scheduled_at||requestCreatedAt(x)):x.updated_at||x.created_at||x.washed_at;', 1)
              return s

          def daily(s):
              return s.replace(
                  'const orderType = (x: any) => x.subscription_id ? pick("Subscription", "اشتراك") : x.offer_id ? pick("Offer", "عرض") : pick("Service order", "أوردر خدمة");',
                  'const orderType = (x: any) => x.booking_request_id ? pick("Customer request", "طلب عميل") : x.offer_id ? pick("Offer", "عرض") : x.subscription_id ? pick("Subscription", "اشتراك") : x.scheduled_at ? pick("Scheduled", "مجدول") : pick("Task", "مهمة");', 1)

          edit('src/routes/_authenticated/admin/tasks.tsx', tasks)
          edit('src/routes/_authenticated/admin/archive.tsx', archive)
          edit('src/routes/_authenticated/admin/daily.tsx', daily)

          # Remove the older patch workflow after applying the real source changes.
          old = Path('.github/workflows/apply-task-archive-update.yml')
          if old.exists():
              old.unlink()
          PY2

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/_authenticated/admin/tasks.tsx src/routes/_authenticated/admin/archive.tsx src/routes/_authenticated/admin/daily.tsx .github/workflows/apply-task-archive-update.yml
          git commit -m 'chore: apply exact task archive updates [done]'
          git push
