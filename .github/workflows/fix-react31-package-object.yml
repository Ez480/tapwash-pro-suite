name: Fix React object rendering in employee dashboard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: employee dashboard package object rendering [applied]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch object rendering safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/_authenticated/employee-tasks.tsx')
          s = p.read_text()

          scan_marker = '  const extractCardValue = (event: any) => {'
          scan_helper = '''  const packageLabel = (value: any) => {
            if (value == null || value === "") return "";
            if (typeof value === "object") return String(value.title_ar || value.title_en || value.name || "");
            return String(value);
          };

          '''
          if 'const packageLabel = (value: any)' not in s:
              if scan_marker not in s:
                  raise SystemExit('NFC marker not found')
              s = s.replace(scan_marker, scan_helper + scan_marker, 1)

          # The RPC may return packages as an embedded object. Never put that object
          # into JSX-facing package_name/package fields.
          s = s.replace('package: subscription.package_name || subscription.package, package_name: subscription.package_name || subscription.package,', 'package: packageLabel(subscription.package_name || subscription.package), package_name: packageLabel(subscription.package_name || subscription.package),')
          s = s.replace('package: refreshed.subscription?.package_name || refreshed.subscription?.package, package_name: refreshed.subscription?.package_name || refreshed.subscription?.package,', 'package: packageLabel(refreshed.subscription?.package_name || refreshed.subscription?.package), package_name: packageLabel(refreshed.subscription?.package_name || refreshed.subscription?.package),')

          marker = '  const renderOrder = (t: any) => {'
          helper = '''  const displayValue = (value: any) => {
            if (value == null || value === "") return "—";
            if (typeof value === "object") return value.title_ar || value.title_en || value.name || value.label || "—";
            return String(value);
          };

          '''
          if 'const displayValue = (value: any)' not in s:
              if marker not in s:
                  raise SystemExit('renderOrder marker not found')
              s = s.replace(marker, helper + marker, 1)

          exact = {
            '{t.package_name || t.offer_name || "—"}': '{displayValue(t.package_name || t.offer_name)}',
            '{t.wash_type || "—"}': '{displayValue(t.wash_type)}',
            '{t.status}': '{displayValue(t.status)}',
            '{card.subscription?.package_name || card.subscription?.package || card.package_name || card.package || "—"}': '{displayValue(card.subscription?.package_name || card.subscription?.package || card.package_name || card.package)}',
          }
          for old, new in exact.items():
              s = s.replace(old, new)

          s = s.replace('{t.package_name}', '{displayValue(t.package_name)}')
          s = s.replace('{t.offer_name}', '{displayValue(t.offer_name)}')
          s = s.replace('{t.wash_type}', '{displayValue(t.wash_type)}')
          s = s.replace('{t.status}', '{displayValue(t.status)}')
          s = s.replace('{card.package_name}', '{displayValue(card.package_name)}')
          s = s.replace('{card.package}', '{displayValue(card.package)}')

          p.write_text(s)
          PY
          git diff --check
          git diff -- src/routes/_authenticated/employee-tasks.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/_authenticated/employee-tasks.tsx
          git commit -m 'fix: employee dashboard package object rendering [applied]'
          git push
          git rm .github/workflows/fix-react31-package-object.yml
          git commit -m 'chore: remove one-time React31 patch workflow'
          git push
